# Sajian statis untuk app SvelteKit (pengganti layanan Next).
#
# Sesuaikan: nama domain, root, dan alamat API. Logika yang tidak boleh diubah:
# - `try_files` jatuh ke /index.html supaya rute dinamis tetap 200;
# - /_app/immutable/* immutable setahun;
# - /index.html no-cache.

server {
	listen 80;
	server_name pasar.contoh.id;

	root /var/www/idx-web;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location /logos/ {
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
